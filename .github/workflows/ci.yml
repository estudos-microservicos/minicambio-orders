name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: MiniCambio.Orders.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore "$SOLUTION"

      - name: Compilar
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test "$SOLUTION" --configuration Release --no-build

  container-scan:
    name: Segurança do container
    uses: ./.github/workflows/container-scan.yml
