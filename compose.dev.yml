# Apenas o Postgres do Orders, para rodar a API com `dotnet run` localmente:
#   docker compose -f compose.dev.yml up -d
# Mesmas credenciais e porta do docker-compose do minicambio-infra (não use os dois ao mesmo tempo).
# O Rates (5001) e o Payments (5002) precisam estar rodando para criar e confirmar ordens.
name: minicambio-orders-dev

services:
  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-local-pwd
    ports:
      - "5435:5432"
    volumes:
      - orders-db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orders-db-dev-data:
